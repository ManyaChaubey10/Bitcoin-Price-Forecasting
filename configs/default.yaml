# Default experiment configuration. Paths are relative to the repository root.
data:
  symbol: BTC-USD
  source: yfinance
  start_date: "2018-01-01"
  end_date_exclusive: "2026-01-01"
  timezone: UTC
  raw_dir: data/raw
  processed_dir: data/processed
  features_file: data/bitcoin_features.csv

target:
  column: Target_Next_Close
  horizon_days: 1
  decision_time: after_daily_close

split:
  train_end: "2023-12-31"
  validation_start: "2024-01-01"
  validation_end: "2024-12-31"
  test_start: "2025-01-01"
  test_end: "2025-12-31"

evaluation:
  strategy: rolling_origin
  horizon_days: 1
  refit_model_during_test: false
  baseline: persistence
  metrics:
    - mae
    - rmse
    - directional_accuracy

xgboost:
  n_estimators_candidates: [300, 500, 800]
  max_depth: 5
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  selection_metric: rmse

arima:
  start_p: 0
  start_q: 0
  max_p: 5
  max_q: 5
  d: 1
  seasonal: false
  stepwise: true
