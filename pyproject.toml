[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-forecasting"
version = "0.1.0"
description = "Reproducible daily BTC-USD forecasting experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "PyYAML>=6,<7",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29,<8",
    "jupyter>=1,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]
arima = [
    "pmdarima>=2.0.4,<3",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14.4,<1",
]
xgboost = [
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
]
lstm = [
    "scikit-learn>=1.5,<2",
    "torch>=2.7,<3",
]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
